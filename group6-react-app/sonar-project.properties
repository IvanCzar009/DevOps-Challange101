# SonarQube Configuration for Group 6 React App - CI/CD Pipeline
sonar.projectKey=group6-react-app
sonar.projectName=Group 6 React Application - Full CI/CD
sonar.projectVersion=1.0.0

# Source code directory
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=node_modules/**,build/**,public/**

# Test settings
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/setupTests.js,**/index.js

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-reporter.xml

# Quality Gate Configuration
sonar.qualitygate.wait=true

# Code Duplication
sonar.cpd.exclusions=**/*.test.js,**/*.test.jsx,**/setupTests.js

# Security and Maintainability
sonar.security.hotspots.inheritFromParent=true
sonar.maintainability.rating=A
sonar.reliability.rating=A

# CI/CD Integration
sonar.verbose=true
sonar.analysis.mode=publish

# Language-specific settings
sonar.javascript.environments=browser,node,jest

# Quality gate settings
sonar.qualitygate.wait=true

# Exclude node_modules and build directories
sonar.exclusions=node_modules/**,build/**,public/**,coverage/**