input {
  # Beats input for log forwarding
  beats {
    port => 5044
  }
  
  # HTTP input for application logs
  http {
    port => 8080
    codec => json
  }
  
  # Syslog input
  syslog {
    port => 514
    type => "syslog"
  }
  
  # Docker logs input
  tcp {
    port => 5000
    codec => json_lines
    type => "docker"
  }
}

filter {
  # Add hostname and timestamp
  mutate {
    add_field => { "received_at" => "%{@timestamp}" }
    add_field => { "received_from" => "%{host}" }
  }
  
  # Process Docker container logs
  if [type] == "docker" {
    # Parse container information
    if [container_name] {
      mutate {
        add_tag => [ "docker", "%{container_name}" ]
      }
    }
  }
  
  # Process GitLab logs
  if [container_name] == "gitlab" {
    mutate {
      add_tag => [ "gitlab" ]
      add_field => { "service" => "gitlab" }
    }
    
    # Parse GitLab Rails logs
    if [message] =~ /Started.*for.*at/ {
      grok {
        match => { 
          "message" => "Started %{WORD:http_method} \"%{URIPATH:request_path}(?:%{URIPARAM:request_params})?\" for %{IP:client_ip} at %{TIMESTAMP_ISO8601:request_timestamp}"
        }
        add_tag => [ "gitlab-request-start" ]
      }
    }
    
    if [message] =~ /Completed.*in.*ms/ {
      grok {
        match => { 
          "message" => "Completed %{INT:http_status:int} %{WORD} in %{NUMBER:total_duration:float}ms.*"
        }
        add_tag => [ "gitlab-request-complete" ]
      }
    }
  }
  
  # Process SonarQube logs
  if [container_name] == "sonarqube" {
    mutate {
      add_tag => [ "sonarqube" ]
      add_field => { "service" => "sonarqube" }
    }
    
    # Parse SonarQube log levels
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:sq_timestamp} %{WORD:log_level}.*"
      }
    }
  }
  
  # Process Tomcat logs
  if [container_name] == "tomcat" {
    mutate {
      add_tag => [ "tomcat" ]
      add_field => { "service" => "tomcat" }
    }
    
    # Parse Tomcat access logs
    if [message] =~ /^\d+\.\d+\.\d+\.\d+/ {
      grok {
        match => { 
          "message" => "%{COMBINEDAPACHELOG}"
        }
        add_tag => [ "tomcat-access" ]
      }
      
      date {
        match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      }
    }
  }
  
  # Process Elasticsearch logs
  if [container_name] == "elasticsearch" {
    mutate {
      add_tag => [ "elasticsearch" ]
      add_field => { "service" => "elasticsearch" }
    }
  }
  
  # Process system logs
  if [type] == "syslog" {
    grok {
      match => { 
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{IPORHOST:syslog_server} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
      }
      add_tag => [ "syslog" ]
    }
    
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
  }
  
  # Remove unnecessary fields to reduce storage
  mutate {
    remove_field => [ "agent", "ecs", "input", "log" ]
  }
  
  # Add environment tag
  mutate {
    add_field => { "environment" => "cicd" }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "changeme123"
    index => "cicd-%{service}-%{+YYYY.MM.dd}"
    template_name => "cicd-template"
    template_pattern => "cicd-*"
    template => {
      "index_patterns" => ["cicd-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
        "refresh_interval" => "5s"
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "service" => { "type" => "keyword" }
          "container_name" => { "type" => "keyword" }
          "log_level" => { "type" => "keyword" }
          "http_status" => { "type" => "integer" }
          "http_method" => { "type" => "keyword" }
          "client_ip" => { "type" => "ip" }
          "total_duration" => { "type" => "float" }
          "environment" => { "type" => "keyword" }
        }
      }
    }
  }
  
  # Debug output (comment out in production)
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}