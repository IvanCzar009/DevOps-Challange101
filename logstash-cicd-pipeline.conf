# Logstash Configuration for CI/CD Pipeline Monitoring
# This configuration processes Jenkins build logs and metrics

input {
  # Jenkins build logs via HTTP
  http {
    port => 9601
    codec => json
    type => "jenkins-build"
  }
  
  # Jenkins console logs via file input
  file {
    path => "/var/jenkins_home/logs/builds/**/*.log"
    type => "jenkins-console"
    start_position => "beginning"
    tags => ["jenkins", "console"]
  }
  
  # SonarQube analysis results
  http {
    port => 9602
    codec => json
    type => "sonarqube-analysis"
  }
  
  # Tomcat deployment logs
  file {
    path => "/home/ec2-user/apache-tomcat-10.1.15/logs/*.log"
    type => "tomcat-deployment"
    tags => ["tomcat", "deployment"]
  }
  
  # Application performance metrics
  http {
    port => 9603
    codec => json
    type => "app-metrics"
  }
}

filter {
  # Process Jenkins build data
  if [type] == "jenkins-build" {
    date {
      match => [ "timestamp", "yyyy-MM-dd_HH-mm-ss" ]
    }
    
    mutate {
      add_field => { "pipeline_type" => "ci_cd" }
      add_field => { "service" => "jenkins" }
    }
    
    # Parse build status and duration
    if [status] == "completed" {
      mutate {
        add_tag => [ "build_success" ]
      }
    } else if [status] == "failed" {
      mutate {
        add_tag => [ "build_failure" ]
      }
    }
  }
  
  # Process SonarQube analysis data
  if [type] == "sonarqube-analysis" {
    mutate {
      add_field => { "service" => "sonarqube" }
    }
    
    # Extract quality metrics
    if [quality_gate_status] == "OK" {
      mutate {
        add_tag => [ "quality_passed" ]
      }
    } else {
      mutate {
        add_tag => [ "quality_failed" ]
      }
    }
  }
  
  # Process Tomcat deployment logs
  if [type] == "tomcat-deployment" {
    grok {
      match => { 
        "message" => "%{TOMCAT_DATESTAMP:timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:log_message}"
      }
    }
    
    date {
      match => [ "timestamp", "dd-MMM-yyyy HH:mm:ss.SSS" ]
    }
    
    mutate {
      add_field => { "service" => "tomcat" }
    }
  }
  
  # Process application metrics
  if [type] == "app-metrics" {
    mutate {
      add_field => { "service" => "application" }
    }
    
    # Convert response times to numbers
    if [response_time] {
      mutate {
        convert => { "response_time" => "float" }
      }
    }
  }
  
  # Add common fields
  mutate {
    add_field => { "environment" => "production" }
    add_field => { "project" => "group6-react-app" }
    add_field => { "ingestion_time" => "%{@timestamp}" }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "cicd-pipeline-%{+YYYY.MM.dd}"
    template_name => "cicd-pipeline"
    template => "/usr/share/logstash/templates/cicd-pipeline-template.json"
    template_overwrite => true
  }
  
  # Debug output for troubleshooting
  if [type] == "jenkins-build" {
    stdout {
      codec => rubydebug {
        metadata => true
      }
    }
  }
  
  # Alert on build failures
  if "build_failure" in [tags] {
    email {
      to => "admin@example.com"
      subject => "🚨 CI/CD Pipeline Failure Alert"
      body => "Build failed for %{pipeline} #%{build_number} on %{timestamp}"
    }
  }
}